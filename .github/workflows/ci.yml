name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:scripts
      - run: npm run dead-code
      - run: npm run build
      # `npm audit` exits non-zero both for a real advisory and for a registry
      # it could not reach, and npmjs.org returned 400s and 503s from
      # /security/audits/quick repeatedly on 2026-09-04, blocking every merge
      # for reasons that had nothing to do with this repository. Retry only the
      # transport failure; a genuine finding still fails on the first attempt,
      # and an endpoint that never recovers still fails the job.
      - name: Audit dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if output="$(npm audit --audit-level=high 2>&1)"; then
              printf '%s\n' "$output"
              exit 0
            fi
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -q 'audit endpoint returned an error'; then
              echo "::warning::npm advisory endpoint unavailable (attempt $attempt of 3); retrying"
              sleep 30
              continue
            fi
            echo "::error::npm audit reported a high-severity advisory"
            exit 1
          done
          echo "::error::npm advisory endpoint unreachable after 3 attempts"
          exit 1
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with: { version: 2.111.0 }
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      # Every step here pipes to tee so the evidence artifact is written even
      # on failure. Without pipefail the exit status is tee's, which is always
      # zero -- the pgTAP suite failed silently on main for weeks while this
      # job reported success.
      - name: Rebuild schema from zero
        shell: bash
        run: |
          set -o pipefail
          mkdir -p migration-evidence
          supabase db reset 2>&1 | tee migration-evidence/reset.log
          supabase migration list --local 2>&1 | tee migration-evidence/migrations.log
      - name: Lint database
        shell: bash
        run: |
          set -o pipefail
          supabase db lint --local --schema public --level warning 2>&1 | tee migration-evidence/lint.log
      - name: Run schema and behavioral pgTAP
        shell: bash
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee migration-evidence/pgtap.log
      - name: Capture generated database types
        run: supabase gen types typescript --local > migration-evidence/database.types.generated.ts
      - name: Verify committed database contract
        run: node scripts/verify-generated-db-types.mjs migration-evidence/database.types.generated.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-evidence
          path: migration-evidence/
  public-e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/public-auth.spec.ts --project=chromium
