name: Staging Database Verification
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending migrations after the dry run
        required: true
        default: false
        type: boolean
jobs:
  verify-staging-database:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with: { version: 2.111.0 }
      - name: Refuse production target
        run: |
          test -n "$STAGING_PROJECT_REF"
          test -n "$STAGING_DB_URL"
          test -n "$PRODUCTION_PROJECT_REF"
          test "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          node -e 'const url = new URL(process.env.STAGING_DB_URL); const ref = process.env.STAGING_PROJECT_REF; const matchesProject = url.hostname.includes(ref) || url.username.endsWith(`.${ref}`); if (!url.hostname.endsWith(".supabase.com") || !matchesProject) process.exit(1)'
      # Every step below pipes to tee so the evidence artifact survives a
      # failure. Without pipefail the step takes tee's exit status, which is
      # always zero -- a rejected migration or a failing pgTAP suite would be
      # reported as a green run. The same masking hid a broken RLS suite in
      # ci.yml for weeks.
      - name: Capture migration status and dry run
        shell: bash
        run: |
          set -o pipefail
          mkdir -p migration-evidence
          supabase migration list --db-url "$STAGING_DB_URL" 2>&1 | tee migration-evidence/migrations-before.log
          supabase db push --db-url "$STAGING_DB_URL" --include-all --dry-run --yes 2>&1 | tee migration-evidence/push-dry-run.log
      - name: Apply migrations to staging
        if: ${{ inputs.apply_migrations }}
        shell: bash
        run: |
          set -o pipefail
          supabase db push --db-url "$STAGING_DB_URL" --include-all --yes 2>&1 | tee migration-evidence/push.log
      - name: Verify applied staging schema
        if: ${{ inputs.apply_migrations }}
        shell: bash
        run: |
          set -o pipefail
          supabase migration list --db-url "$STAGING_DB_URL" 2>&1 | tee migration-evidence/migrations-after.log
          # Scoped to public: the only schema this project authors. Without it
          # the linter also walks `extensions`, where pgTAP lives, and reports
          # eight errors that are all false. pgTAP creates __tcache__ and
          # __tresults___numb_seq at runtime, and references proisagg and
          # spclocation inside version-guarded branches for PostgreSQL releases
          # that removed them; a static reader of function bodies cannot know
          # either. Those errors have been failing this step since August and
          # were invisible until the tee pipe stopped swallowing the exit code.
          supabase db lint --db-url "$STAGING_DB_URL" --schema public --level warning --fail-on error 2>&1 | tee migration-evidence/lint-linked.log
          supabase test db --db-url "$STAGING_DB_URL" 2>&1 | tee migration-evidence/pgtap-linked.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: staging-database-evidence
          path: migration-evidence/
