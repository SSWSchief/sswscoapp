name: Production Health Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production health endpoint
        env:
          HEALTH_URL: https://sswscoapp.vercel.app/api/health
          EXPECTED_STRIPE_MODE: test
          EXPECTED_INVOICING_ENABLED: "false"
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header 'Accept: application/json' "$HEALTH_URL")"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            const data = payload.data;
            if (!data || data.status !== "ok") {
              throw new Error("Production health response is not healthy");
            }
            if (data.dependencies?.database?.status !== "reachable") {
              throw new Error("Production database dependency is not reachable");
            }
            if (!data.release || data.release === "local") {
              throw new Error("Production health response reports no release SHA");
            }
            if (!data.stripe?.configured) {
              throw new Error("Stripe account, key, and webhook configuration is incomplete");
            }
            if (data.stripe.mode !== process.env.EXPECTED_STRIPE_MODE || data.stripe.expectedMode !== process.env.EXPECTED_STRIPE_MODE) {
              throw new Error("Stripe mode differs from the controlled rollout mode");
            }
            if (String(data.stripe.invoicingEnabled) !== process.env.EXPECTED_INVOICING_ENABLED) {
              throw new Error("Stripe sending feature flag differs from the controlled rollout state");
            }
          ' "$response"
